name: Deploy iPad PWA to GitHub Pages

# Build and publish the desktop app's web bundle as the iPad PWA. The
# same Vite/React codebase ships two ways:
#   - Tauri shell on macOS (npm run tauri:build → .dmg in Releases)
#   - PWA on GitHub Pages (this workflow), served at
#     https://shamgarbn.github.io/paperplate/
# `BUILD_TARGET=pwa` swaps Vite's `base` to `/paperplate/` so asset URLs
# resolve correctly under that path.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skip in-progress runs in favour of latest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build PWA
        run: npm -w @paperplate/desktop run build:pwa

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/desktop/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
