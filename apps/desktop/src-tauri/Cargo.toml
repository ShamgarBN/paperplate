[package]
name = "paperplate"
version = "1.0.1"
description = "A locally-stored macOS digital recipe book."
authors = ["Paperplate contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "paperplate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "cookies"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2"
thiserror = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
